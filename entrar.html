<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magical Bites | Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Poppins', sans-serif;
    }

    .container{
        display:flex;
        height:100vh;
    }

    /* LADO ESQUERDO */
    .left{
        width:50%;
        background: linear-gradient(135deg, #060220, #1f4396);
        display:flex;
        align-items:center;
        justify-content:flex-start;
        padding-left:250px;
    }

    .logo{
        max-width:85%;
        height:auto;
    }

    /* LADO DIREITO */
    .right{
        width:50%;
        background:#2e4a92;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .form-box{
        width:75%;
        max-width:420px;
        color:white;
    }

    .form-box h2{
        font-size:32px;
        margin-bottom:5px;
    }

    .form-box p{
        font-size:15px;
        margin-bottom:35px;
        opacity:0.8;
    }

    /* INPUTS */
    .input-group{
        background:rgba(255,255,255,0.2);
        border-radius:40px;
        margin-bottom:22px;
        padding:14px 18px;
        display:flex;
        align-items:center;
    }

    .input-group i{
        margin-right:12px;
    }

    .input-group input{
        border:none;
        background:none;
        outline:none;
        color:white;
        width:100%;
        font-size:15px;
    }

    .input-group input::placeholder{
        color:#e0e0e0;
    }

    /* BOTÃO */
    button{
        width:100%;
        padding:16px;
        border:none;
        border-radius:40px;
        background:#1c3f94;
        color:white;
        font-size:20px;
        font-weight:600;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#162f6b;
        transform:scale(1.04);
    }

    /* LINK CADASTRO */
    .register{
        margin-top:22px;
        font-size:14px;
        text-align:center;
    }

    .register a{
        color:white;
        font-weight:600;
        text-decoration:none;
    }

    /* RESPONSIVO */
    @media(max-width:900px){
        .container{
            flex-direction:column;
        }

        .left, .right{
            width:100%;
            height:50vh;
        }

        .left{
            justify-content:center;
            padding-left:0;
        }

        .logo{
            max-width:60%;
        }
    }
</style>
</head>

<body>

    <div class="container">

        <!-- LADO ESQUERDO COM LOGO -->
        <div class="left">
            <img src="logo.png" alt="Magical Bites Logo" class="logo">
        </div>

        <!-- LADO DIREITO COM FORMULÁRIO -->
        <div class="right">
            <div class="form-box">
                <h2>Bem-vindo</h2>
                <p>Entre na sua conta</p>

                <form action="index.php" method="POST">

                    <div class="input-group">
                        <i class="fa fa-envelope"></i>
                        <input type="email" name="email" placeholder="Email" required>
                    </div>

                    <div class="input-group">
                        <i class="fa fa-lock"></i>
                        <input type="password" name="senha" placeholder="Senha" required>
                    </div>

                    <button type="submit">ENTRAR</button>

                </form>

                <div class="register">
                    Não tem conta? <a href="cadastro.html">Cadastrar</a>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
