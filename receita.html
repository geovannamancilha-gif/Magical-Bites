<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Receita | Magical Bites</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:#3d4f8f;
    color:white;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#060220,#2d3f87);
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:600;
}

/* CONTAINER */
.container{
    width:80%;
    margin:40px auto;
    background:rgba(255,255,255,0.08);
    border-radius:15px;
    overflow:hidden;
    padding-bottom:30px;
}

/* IMAGEM */
.container img{
    width:100%;
    height:400px;
    object-fit:cover;
}

/* TEXTO */
.conteudo{
    padding:30px;
}

h1{
    margin-bottom:20px;
}

h2{
    margin-top:30px;
    margin-bottom:10px;
    color:#ffd369;
}

ul{
    margin-left:20px;
}

li{
    margin-bottom:10px;
}

p{
    line-height:1.8;
}

/* BOTÃO */
.voltar{
    display:inline-block;
    margin-top:30px;
    padding:12px 20px;
    background:#2d4fd7;
    color:white;
    text-decoration:none;
    border-radius:30px;
    transition:0.3s;
}

.voltar:hover{
    background:#1f3bb3;
}

</style>

</head>

<body>

<div class="header">
    Magical Bites ✨
</div>

<div class="container">

    <img src="https://i.imgur.com/2l9K6Xy.jpg">

    <div class="conteudo">

        <h1>🍰 Bolo Encantado da Bela</h1>

        <h2>Ingredientes</h2>

        <ul>
            <li>2 xícaras de farinha</li>
            <li>1 xícara de açúcar</li>
            <li>3 ovos</li>
            <li>1 colher de fermento</li>
        </ul>

        <h2>Modo de preparo</h2>

        <p>
            Misture todos os ingredientes em uma tigela.
            Depois coloque em uma forma untada e asse por 40 minutos.
            Sirva ainda quentinho ✨
        </p>

        <a href="principal.html" class="voltar">
            ← Voltar
        </a>

    </div>

</div>

</body>
</html>
