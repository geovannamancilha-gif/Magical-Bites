<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastro de Endereço</title>

<style>
*{
  box-sizing:border-box;
  font-family: 'Segoe UI', Tahoma, sans-serif;
}

body{
  background: linear-gradient(135deg, #423f8a, #d3abf8);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0;
}

.container{
  background:#fff;
  padding:35px;
  border-radius:18px;
  width:420px;
  box-shadow:0 15px 40px rgba(0,0,0,0.2);
  animation: fade 0.6s ease;
}

@keyframes fade{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

h2{
  text-align:center;
  margin-bottom:20px;
  color:#4f46e5;
}

label{
  font-weight:600;
  margin-top:12px;
  display:block;
}

input{
  width:100%;
  padding:10px;
  margin-top:5px;
  border-radius:8px;
  border:1px solid #ccc;
  transition:0.3s;
  font-size:14px;
}

input:focus{
  outline:none;
  border-color:#4f46e5;
  box-shadow:0 0 0 2px rgba(79,70,229,0.2);
}

button{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg, #4f46e5, #9333ea);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.mensagem{
  text-align:center;
  margin-top:18px;
  font-weight:bold;
  color:#16a34a;
  display:none;
}
</style>
</head>

<body>

<div class="container">
  <h2>Cadastro de Endereço</h2>

  <form id="formCadastro">
    <label>Nome</label>
    <input type="text" id="nome">

    <label>Endereço</label>
    <input type="text" id="endereco">

    <label>Número</label>
    <input type="text" id="numero">

    <label>Bairro</label>
    <input type="text" id="bairro">

    <label>Cidade</label>
    <input type="text" id="cidade">

    <label>Estado</label>
    <input type="text" id="estado">

    <label>CEP</label>
    <input type="text" id="cep">

    <button type="button" onclick="simularCadastro()">
      Simular Cadastro
    </button>

    <div class="mensagem" id="mensagem">
      Informações cadastradas com sucesso!
    </div>
  </form>
</div>

<script>
function simularCadastro(){
  const campos = document.querySelectorAll("input");
  let completo = true;

  const msg = document.getElementById("mensagem");

  if(completo){
    msg.style.display = "block";
  } else {
    msg.style.display = "none";
  }
}
</script>

</body>
</html>
