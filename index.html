<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magical Bites | Início</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

.container{
    display:flex;
    height:100vh;
}

/* LADO ESQUERDO */
.left{
    width:50%;
    background: linear-gradient(135deg, #060220, #1f4396);
    display:flex;
    align-items:center;
    justify-content:flex-start;
    padding-left:250px;
}

.logo{
    max-width:85%;
}

/* LADO DIREITO */
.right{
    width:50%;
    background:#2e4a92;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:80%;
    max-width:480px;
    color:white;
}

/* TÍTULO */
.box h1{
    font-size:52px;
    font-weight:800;
    line-height:1.1;
    margin-bottom:20px;
}

/* PALAVRA DESTACADA */
.highlight{
    color:#9ec5ff;
}

/* DESCRIÇÃO */
.box p{
    font-size:18px;
    margin-bottom:40px;
    opacity:0.9;
}

/* BOTÕES */
.buttons{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.btn{
    padding:16px;
    border:none;
    border-radius:40px;
    background:#1c3f94;
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
    text-decoration:none;
    text-align:center;
}

.btn:hover{
    background:#162f6b;
    transform:scale(1.05);
}

/* BOTÃO SECUNDÁRIO */
.secondary{
    background:transparent;
    border:2px solid white;
}

.secondary:hover{
    background:white;
    color:#2e4a92;
}

/* RESPONSIVO */
@media(max-width:900px){
    .container{
        flex-direction:column;
    }

    .left, .right{
        width:100%;
        height:50vh;
    }

    .left{
        justify-content:center;
        padding-left:0;
    }

    .logo{
        max-width:60%;
    }

    .box h1{
        font-size:38px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- LADO ESQUERDO COM LOGO -->
    <div class="left">
        <img src="logo.png" alt="Magical Bites Logo" class="logo">
    </div>

    <!-- LADO DIREITO -->
    <div class="right">
        <div class="box">

            <h1>
                Descubra o sabor da
                <span class="highlight">magia</span> 🍰
            </h1>
            <p>Raoni</p>

            <p>
                Bem-vindo ao Magical Bites — onde cada doce conta uma história.
            </p>

            <div class="buttons">

                <a href="entrar.html" class="btn">Entrar</a>

                <a href="cadastro.html" class="btn secondary">
                    Criar Conta
                </a>

                <!-- BOTÃO DO PAINEL -->
                <a href="pagina_usuarios.php" class="btn">
                    Painel de Usuários
                </a>

            </div>

        </div>
    </div>

</div>

</body>
</html>
